services:
  # 1. Express REST API Service (Serves /api/deals, /api/products, /api/alerts, etc.)
  - type: web
    name: shoppersdeals-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm --prefix api install
    startCommand: npm --prefix api start
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        value: mongodb+srv://arorakaran6992:FUpX6I53NEB4UhSW@cluster0.zid9f.mongodb.net/shoppers_deals?retryWrites=true&w=majority
      - key: DEEPSEEK_API_KEY
        value: sk-c8c1eb9405d5464ab90e47f20f35b079
      - key: ALGOLIA_APP_ID
        value: 2PJDY54E3H
      - key: ALGOLIA_ADMIN_API_KEY
        value: 6de26203cc83434c3d70165ed58c2b83
      - key: TWOCAPTCHA_API_KEY
        value: 00f69cd4eefad8d5ccfe712289733973

  # 2. Independent Scraper Workers (horizontally scalable — add more of
  # these to add scraping throughput, without touching the api service).
  # Each pulls jobs from the same BullMQ "scraper-queue" in Redis and
  # self-throttles to 1 job/2.5s, so N workers = N times the aggregate
  # throughput. See api/src/services/scraperWorker.js.
  - type: web
    name: shoppersdeals-scraper-1
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm --prefix api install
    startCommand: npm --prefix api run worker:scraper
    envVars:
      - key: MONGODB_URI
        value: mongodb+srv://arorakaran6992:FUpX6I53NEB4UhSW@cluster0.zid9f.mongodb.net/shoppers_deals?retryWrites=true&w=majority
      - key: REDIS_URL
        value: redis://red-da8mgqoae00c73dcksk0:6379

  - type: web
    name: shoppersdeals-scraper-2
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm --prefix api install
